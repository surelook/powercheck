name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      VITE_GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    # postinstall fetches the outage data baked into the build
    - name: Install dependencies
      run: npm ci

    - name: Check out history
      id: archive
      continue-on-error: true
      run: |
        if git fetch --depth=1 origin history; then
          git worktree add -B history data/archive FETCH_HEAD
        else
          git worktree add --orphan -b history data/archive
        fi

    - name: Record history
      id: record
      if: steps.archive.outcome == 'success'
      continue-on-error: true
      run: npm run history

    - name: Push history
      if: steps.record.outcome == 'success'
      continue-on-error: true
      working-directory: data/archive
      run: |
        git add -A
        git -c user.name='github-actions[bot]' \
          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          commit --quiet -m "Snapshot $(date -u +%FT%TZ)"
        git push --quiet origin history

    - name: Build
      run: npm run build

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: dist

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
